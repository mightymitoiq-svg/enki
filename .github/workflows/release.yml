name: Release

# Builds installers on tag push (v*) and publishes them to a GitHub Release
# named after the tag. workflow_dispatch builds without publishing semantics
# changed (tauri-action upserts the same v<version> release).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # MSI + NSIS installer
          - os: ubuntu-latest # deb + rpm + AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@39370e3970a06d0a1103b67bcf204362a7f3e2fb # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Frontend tests
        run: npm --prefix ui test

      - name: Backend tests (Rust)
        working-directory: src-tauri
        run: cargo test

      - name: Build app and publish release artifacts
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "ENKI v__VERSION__"
          releaseBody: "ENKI v__VERSION__ — desktop foundation release.\n\n- Windows: MSI and NSIS (setup.exe) installers\n- Linux: deb, rpm, AppImage\n- Installers are unsigned; expect a SmartScreen/Gatekeeper warning.\n- The coding workspace (conversation, editor, terminal) lands in the next milestone; the Agents page reports engine discovery only."
          releaseDraft: false
          prerelease: false
