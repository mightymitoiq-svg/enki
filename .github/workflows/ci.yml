name: CI

# Runs the full check suite on ordinary development changes: pushes to main
# and all pull requests. The Release workflow (release.yml) handles tags.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: frontend + backend tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Lint (frontend)
        run: npm --prefix ui run lint --if-present

      - name: Frontend tests
        run: npm --prefix ui test

      - name: Backend tests (Rust)
        working-directory: src-tauri
        run: cargo test

      - name: Backend lint (clippy)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  build:
    name: production build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: TypeScript check + production build
        run: npm --prefix ui run build
