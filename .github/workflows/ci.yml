name: CI

# Runs the full check suite on ordinary development changes: pushes to main
# and all pull requests. The Release workflow (release.yml) handles tags.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: frontend + backend tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@39370e3970a06d0a1103b67bcf204362a7f3e2fb # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Lint (frontend)
        run: npm --prefix ui run lint --if-present

      - name: Frontend tests
        run: npm --prefix ui test

      - name: Backend tests (Rust)
        working-directory: src-tauri
        run: cargo test

      - name: Backend lint (clippy)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  build:
    name: production build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a06d0a1103b67bcf204362a7f3e2fb # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: TypeScript check + production build
        run: npm --prefix ui run build
